<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8e8"><meta name="description" content="A simple private notes app">
<link rel="manifest" href="manifest.json"><title>Simple Notes</title>
<style>
:root{--bg:#fffdf8;--card:#fff;--text:#24231f;--muted:#77736a;--line:#e9e4d9;--accent:#f5c451;--input:#f7f4ec}
[data-theme=dark]{--bg:#151515;--card:#222;--text:#f5f2e9;--muted:#aaa69c;--line:#383838;--accent:#f5c451;--input:#2c2c2c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:18px 17px 12px;z-index:2;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}.top h1{font-size:30px;margin:0;flex:1;letter-spacing:-1px}.iconbtn{border:0;background:transparent;color:var(--text);font-size:21px;padding:8px;border-radius:12px}
.search, input, textarea, select{font:inherit;color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:13px;padding:12px;width:100%;outline:none}
.search{margin-top:14px}nav{display:flex;gap:8px;overflow:auto;padding:12px 17px;scrollbar-width:none}nav button,.pill{border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:var(--card);color:var(--text);white-space:nowrap}nav button.active{background:var(--accent);border-color:var(--accent);color:#28200b}
main{padding:0 17px 100px}.note{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin:0 0 11px;box-shadow:0 2px 7px #00000005}.notehead{display:flex;align-items:center;gap:8px}.note h3{font-size:17px;margin:0;flex:1;overflow-wrap:anywhere}.preview{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:14px;margin:8px 0;max-height:62px;overflow:hidden}.meta{display:flex;align-items:center;color:var(--muted);font-size:12px;gap:8px}.meta span:first-child{flex:1}.star{border:0;background:transparent;font-size:19px;color:#bb8a0b}.empty{text-align:center;color:var(--muted);padding:60px 15px}.fab{position:fixed;bottom:22px;right:20px;border:0;background:var(--accent);color:#241d0b;font-size:30px;width:60px;height:60px;border-radius:20px;box-shadow:0 6px 18px #0002}
.editor{position:fixed;inset:0;background:var(--bg);z-index:5;display:none;flex-direction:column;padding:12px 17px max(15px,env(safe-area-inset-bottom))}.editor.show{display:flex}.toolbar{display:flex;align-items:center;gap:7px;margin-bottom:14px}.toolbar strong{flex:1;font-size:18px}.editor input{font-size:24px;font-weight:700;background:transparent;border:0;padding:10px 0}.editor textarea{flex:1;resize:none;margin-top:8px;background:transparent;border:0;padding:8px 0;line-height:1.55}.editor select{width:auto;max-width:50%;padding:8px}.actions{display:flex;gap:8px;align-items:center;margin:8px 0}.actions button,.primary{border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 13px;border-radius:12px}.primary{background:var(--accent);color:#241d0b;border-color:var(--accent);font-weight:650}.checkrow{display:flex;gap:9px;align-items:flex-start;padding:6px 0}.checkrow input{width:auto;margin-top:5px}
dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:18px;width:calc(100% - 32px);max-width:420px}dialog::backdrop{background:#0008}.dialogactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.hint{font-size:12px;color:var(--muted)}
</style></head>
<body>
<header><div class="top"><h1>Notes</h1><button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode">☾</button><button class="iconbtn" id="lockBtn" aria-label="Lock notes">♙</button><button class="iconbtn" id="folderBtn" aria-label="Manage folders">▣</button></div><input class="search" id="search" placeholder="Search your notes" autocomplete="off"></header>
<nav id="filters"></nav><main id="notes"></main><button class="fab" id="add" aria-label="New note">＋</button>
<section class="editor" id="editor"><div class="toolbar"><button class="iconbtn" id="back">‹</button><strong id="editorLabel">New note</strong><button class="iconbtn" id="favBtn" title="Favourite">☆</button><button class="iconbtn" id="deleteBtn" title="Delete note">⌫</button></div>
<input id="title" placeholder="Title" maxlength="180"><div class="actions"><select id="noteFolder" aria-label="Folder"></select><button id="checkBtn">☑ Checklist</button><span class="hint" id="saved">Saved</span></div>
<div id="checkItems" style="display:none;overflow:auto;max-height:42%;"></div><textarea id="body" placeholder="Start writing…"></textarea><div class="actions"><button id="addItem" style="display:none">＋ Checklist item</button><button class="primary" id="saveBtn" style="margin-left:auto">Done</button></div></section>
<dialog id="folderDialog"><h3>Folders</h3><div id="folderList"></div><p><input id="newFolder" placeholder="New folder name" maxlength="40"></p><div class="dialogactions"><button id="closeFolders">Close</button><button class="primary" id="createFolder">Add folder</button></div></dialog>
<dialog id="pinDialog"><h3 id="pinTitle">Privacy lock</h3><p id="pinMessage">Set a 4–8 digit PIN. This basic version does not encrypt notes.</p><input id="pinInput" inputmode="numeric" type="password" maxlength="8" placeholder="PIN"><div class="dialogactions"><button id="cancelPin">Cancel</button><button class="primary" id="submitPin">Continue</button></div></dialog>
<script>
const $=id=>document.getElementById(id);
const KEY='simple-notes-v1', FKEY='simple-notes-folders-v1', TKEY='simple-notes-theme-v1', PKEY='simple-notes-pin-v1';
let notes=[],folders=['Personal','Work','Ideas'],filter='All notes',current=null,dirtyTimer=null,checkItems=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{notes=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{notes=[]}try{folders=JSON.parse(localStorage.getItem(FKEY)||'["Personal","Work","Ideas"]')}catch{}document.documentElement.dataset.theme=localStorage.getItem(TKEY)||'light';renderFilters();renderNotes()}
function persist(){localStorage.setItem(KEY,JSON.stringify(notes));renderNotes();$('saved').textContent='Saved'}
function renderFilters(){const names=['All notes','Favourites',...folders];$('filters').innerHTML=names.map(n=>`<button class="${filter===n?'active':''}" data-filter="${esc(n)}">${esc(n)}</button>`).join('');$('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderFilters();renderNotes()})}
function renderNotes(){const q=$('search').value.toLowerCase();let list=notes.filter(n=>(filter==='All notes'||(filter==='Favourites'?n.favourite:n.folder===filter))&&(`${n.title} ${n.body} ${(n.items||[]).map(x=>x.text).join(' ')}`).toLowerCase().includes(q)).sort((a,b)=>b.updated-a.updated);$('notes').innerHTML=list.length?list.map(n=>`<article class="note" data-id="${n.id}"><div class="notehead"><h3>${esc(n.title||'Untitled note')}</h3><button class="star" data-star="${n.id}">${n.favourite?'★':'☆'}</button></div><div class="preview">${esc(n.items?.length?n.items.map(x=>(x.done?'✓ ':'□ ')+x.text).join('\\n'):n.body)}</div><div class="meta"><span>${esc(n.folder||'Personal')}</span><span>${new Date(n.updated).toLocaleDateString()}</span><button class="iconbtn" data-del="${n.id}" aria-label="Delete note">⌫</button></div></article>`).join(''):'<div class="empty"><div style="font-size:40px">▤</div><h3>No notes found</h3><p>Tap ＋ to write your first note.</p></div>';document.querySelectorAll('[data-id]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-star]')||e.target.closest('[data-del]'))return;openNote(el.dataset.id)});document.querySelectorAll('[data-star]').forEach(b=>b.onclick=e=>{e.stopPropagation();const n=notes.find(x=>x.id===b.dataset.star);n.favourite=!n.favourite;n.updated=Date.now();persist()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(confirm('Delete this note?')){notes=notes.filter(n=>n.id!==b.dataset.del);persist()}})}
function openNote(id=null){current=id?notes.find(n=>n.id===id):{id:crypto.randomUUID(),title:'',body:'',folder:folders[0]||'Personal',favourite:false,items:[],updated:Date.now()};if(!current.items)current.items=[];checkItems=current.items.map(x=>({...x}));$('title').value=current.title;$('body').value=current.body;$('noteFolder').innerHTML=folders.map(f=>`<option>${esc(f)}</option>`).join('');$('noteFolder').value=current.folder;$('favBtn').textContent=current.favourite?'★':'☆';$('checkItems').style.display=checkItems.length?'block':'none';$('addItem').style.display=checkItems.length||current.checklist?'inline-block':'none';$('editorLabel').textContent=id?'Edit note':'New note';$('editor').classList.add('show');drawChecks();$('title').focus()}
function drawChecks(){$('checkItems').innerHTML=checkItems.map((x,i)=>`<div class="checkrow"><input type="checkbox" data-check="${i}" ${x.done?'checked':''}><input data-item="${i}" value="${esc(x.text)}" placeholder="Checklist item"><button class="iconbtn" data-remove="${i}">×</button></div>`).join('');$('checkItems').querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{checkItems[+el.dataset.check].done=el.checked;autoSave()});$('checkItems').querySelectorAll('[data-item]').forEach(el=>el.oninput=()=>{checkItems[+el.dataset.item].text=el.value;autoSave()});$('checkItems').querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{checkItems.splice(+el.dataset.remove,1);drawChecks();autoSave()})}
function saveNote(){if(!$('title').value.trim()&&!$('body').value.trim()&&!checkItems.some(x=>x.text.trim())){notes=notes.filter(n=>n.id!==current.id);localStorage.setItem(KEY,JSON.stringify(notes));renderNotes();return}const n={...current,title:$('title').value,body:$('body').value,folder:$('noteFolder').value||folders[0]||'Personal',items:checkItems,updated:Date.now()};const i=notes.findIndex(x=>x.id===n.id);if(i>=0)notes[i]=n;else notes.unshift(n);current=n;localStorage.setItem(KEY,JSON.stringify(notes));$('saved').textContent='Saved';renderNotes()}
function autoSave(){ $('saved').textContent='Saving…';clearTimeout(dirtyTimer);dirtyTimer=setTimeout(saveNote,500)}
$('add').onclick=()=>openNote();$('back').onclick=$('saveBtn').onclick=()=>{saveNote();$('editor').classList.remove('show');renderNotes()};$('title').oninput=$('body').oninput=autoSave;$('noteFolder').onchange=autoSave;$('favBtn').onclick=()=>{current.favourite=!current.favourite;$('favBtn').textContent=current.favourite?'★':'☆';autoSave()};$('deleteBtn').onclick=()=>{if(confirm('Delete this note?')){notes=notes.filter(n=>n.id!==current.id);localStorage.setItem(KEY,JSON.stringify(notes));$('editor').classList.remove('show');renderNotes()}};$('checkBtn').onclick=()=>{if(!checkItems.length)checkItems.push({text:'',done:false});$('addItem').style.display='inline-block';$('checkItems').style.display='block';drawChecks();autoSave()};$('addItem').onclick=()=>{checkItems.push({text:'',done:false});drawChecks();autoSave()};$('search').oninput=renderNotes;
$('themeBtn').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem(TKEY,t);$('themeBtn').textContent=t==='dark'?'☀':'☾'};
$('folderBtn').onclick=()=>{renderFolderDialog();$('folderDialog').showModal()};function renderFolderDialog(){$('folderList').innerHTML=folders.map(f=>`<p>${esc(f)}</p>`).join('')||'<p>No folders yet</p>'};$('createFolder').onclick=()=>{const f=$('newFolder').value.trim();if(f&&!folders.includes(f)&&!['All notes','Favourites'].includes(f)){folders.push(f);localStorage.setItem(FKEY,JSON.stringify(folders));$('newFolder').value='';renderFilters();renderFolderDialog()}else if(!f)alert('Enter a folder name first.')};$('closeFolders').onclick=()=>$('folderDialog').close();
let pinMode='set';$('lockBtn').onclick=()=>{if(sessionStorage.getItem('unlocked')==='yes'){sessionStorage.removeItem('unlocked');location.reload();return}pinMode=localStorage.getItem(PKEY)?'unlock':'set';$('pinTitle').textContent=pinMode==='set'?'Set privacy PIN':'Unlock notes';$('pinMessage').textContent=pinMode==='set'?'Choose a 4–8 digit PIN. Note: this starter does not encrypt stored notes.':'Enter your PIN to unlock this app.';$('pinInput').value='';$('pinDialog').showModal()};$('cancelPin').onclick=()=>$('pinDialog').close();$('submitPin').onclick=()=>{const v=$('pinInput').value;if(pinMode==='set'){if(!/^\d{4,8}$/.test(v)){alert('Use 4 to 8 digits.');return}localStorage.setItem(PKEY,v);alert('PIN set on this device. This is only a basic screen lock, not encryption.')}else if(v!==localStorage.getItem(PKEY)){alert('Incorrect PIN.');return}sessionStorage.setItem('unlocked','yes');$('pinDialog').close();if(pinMode==='unlock')location.reload()};
load();
if(localStorage.getItem(PKEY)&&sessionStorage.getItem('unlocked')!=='yes'){
  pinMode='unlock'; $('pinTitle').textContent='Unlock notes';
  $('pinMessage').textContent='Enter your PIN to unlock this app. This basic screen lock does not encrypt stored notes.';
  $('cancelPin').style.display='none'; $('pinInput').value=''; $('pinDialog').showModal();
}
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
